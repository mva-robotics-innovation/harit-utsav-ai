<!doctype html>
<html>
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ASHISH KUMAR | Portfolio Hero</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#050807;color:#fff;font-family:'Space Grotesk',sans-serif;overflow:hidden;height:100vh}
  #canvas{position:fixed;inset:0;width:100%;height:100%}
  .ui{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;padding:22px;z-index:2}
  .top{display:flex;justify-content:space-between;font-size:12px;letter-spacing:2px;opacity:.7}
  .left{position:absolute;left:22px;top:50%;transform:translateY(-50%);font-size:11px;letter-spacing:1px;opacity:.6}
  .right{position:absolute;right:22px;top:50%;transform:translateY(-50%);font-size:11px;text-align:right;opacity:.6}
  .bottom{position:absolute;bottom:28px;left:50%;transform:translateX(-50%);text-align:center}
  .bottom h1{font-size:42px;line-height:.9;letter-spacing:-1px}
  .bottom h1 span{color:#00ff9d}
  .bottom p{font-size:13px;opacity:.7;margin-top:8px}
  .btn{pointer-events:auto;margin-top:14px;display:inline-block;padding:12px 22px;border-radius:999px;background:#00ff9d;color:#000;font-weight:700;text-decoration:none;font-size:14px}
  #startBtn{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:10;padding:16px 28px;border-radius:999px;background:#00ff9d;color:#000;font-weight:800;border:none;cursor:pointer;font-size:16px}
  video{position:fixed;bottom:10px;right:10px;width:120px;opacity:.25;border-radius:12px;z-index:1}
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<video id="video" autoplay muted playsinline></video>

<div class="ui">
  <div class="top"><span>AK.</span><span>PORTFOLIO 2026</span></div>
  <div class="left">Ashish Kumar<br>MCA · JRU Ranchi</div>
  <div class="right">Builds cool things<br>with AI</div>
  <div class="bottom">
    <h1>ASHISH <span>KUMAR</span></h1>
    <p>Tradition Meets Technology · HARIT UTSAV AI · MVA Robotics</p>
    <a class="btn" href="https://harit-utsav-ai.vercel.app" target="_blank">View My Work ↗</a>
  </div>
</div>

<button id="startBtn">✦ Enable Camera — Turn Your Face</button>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script>
const canvas=document.getElementById('canvas');
const renderer=new THREE.WebGLRenderer({canvas,alpha:true});
renderer.setPixelRatio(devicePixelRatio);
renderer.setSize(innerWidth,innerHeight);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,0.1,100);
camera.position.z=3.2;

const COUNT=468;
const geo=new THREE.BufferGeometry();
const pos=new Float32Array(COUNT*3);
const colors=new Float32Array(COUNT*3);
geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
geo.setAttribute('color',new THREE.BufferAttribute(colors,3));
const mat=new THREE.PointsMaterial({size:0.025,vertexColors:true,transparent:true,opacity:0.95,sizeAttenuation:true});
const points=new THREE.Points(geo,mat);
scene.add(points);

let targetRotX=0,targetRotY=0,curX=0,curY=0;
let facePts=null;

// Mouse fallback - if no camera, mouse moves it
addEventListener('mousemove',e=>{
  targetRotY=(e.clientX/innerWidth-0.5)*1.2;
  targetRotX=(e.clientY/innerHeight-0.5)*0.6;
});

const faceMesh=new FaceMesh({locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${f}`});
faceMesh.setOptions({maxNumFaces:1,refineLandmarks:true,minDetectionConfidence:0.5,minTrackingConfidence:0.5});
faceMesh.onResults(res=>{
  if(!res.multiFaceLandmarks?.length) return;
  facePts=res.multiFaceLandmarks[0];
  // Head turn from nose + eyes
  const nose=facePts[1], leftEye=facePts[33], rightEye=facePts[263];
  const dx=rightEye.x-leftEye.x;
  targetRotY=(0.5-nose.x)*3.2;
  targetRotX=(nose.y-0.5)*2.2;
  // Update particle positions from face shape
  for(let i=0;i<COUNT;i++){
    const p=facePts[i];
    pos[i*3]=(p.x-0.5)*3.2;
    pos[i*3+1]=(0.5-p.y)*3.2;
    pos[i*3+2]=(p.z||0)*-1.5;
    // Green to white gradient like in Reel
    const t=p.y;
    colors[i*3]=0.1+t*0.8; colors[i*3+1]=1; colors[i*3+2]=0.6+t*0.4;
  }
  geo.attributes.position.needsUpdate=true;
  geo.attributes.color.needsUpdate=true;
});

document.getElementById('startBtn').onclick=async()=>{
  document.getElementById('startBtn').style.display='none';
  const video=document.getElementById('video');
  const cam=new Camera(video,{onFrame:async()=>{await faceMesh.send({image:video})},width:640,height:480});
  cam.start();
};

function animate(){
  requestAnimationFrame(animate);
  curX+=(targetRotX-curX)*0.08;
  curY+=(targetRotY-curY)*0.08;
  points.rotation.y=curY;
  points.rotation.x=curX;
  // Idle float if no face yet
  if(!facePts){
    const t=Date.now()*0.001;
    for(let i=0;i<COUNT;i++){
      pos[i*3]=Math.cos(i)*1.2+Math.sin(t+i)*0.05;
      pos[i*3+1]=Math.sin(i*1.3)*1.2;
      pos[i*3+2]=Math.cos(i*0.7)*0.5;
      colors[i*3]=0.2;colors[i*3+1]=1;colors[i*3+2]=0.7;
    }
    geo.attributes.position.needsUpdate=true;
  }
  renderer.render(scene,camera);
}
animate();
addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()});
</script>
</body>
</html>

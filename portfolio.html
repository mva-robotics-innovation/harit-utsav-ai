<!doctype html>
<html>
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ASHISH KUMAR | Portfolio Hero</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#050505;color:#fff;font-family:Inter,system-ui,sans-serif;overflow:hidden;height:100vh}
  #canvas{position:fixed;inset:0;width:100%;height:100%}
  .ui{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;padding:20px;z-index:2}
  .top{display:flex;justify-content:space-between;font-size:11px;letter-spacing:2px;opacity:.6}
  .top a{pointer-events:auto;color:#fff;text-decoration:none;opacity:.9}
  .left{position:absolute;left:20px;top:50%;transform:translateY(-50%);font-size:11px;line-height:1.7;opacity:.55}
  .right{position:absolute;right:20px;top:50%;transform:translateY(-50%);font-size:11px;text-align:right;line-height:1.7;opacity:.55}
  .bottom{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);text-align:center;width:92%;max-width:560px}
  .bottom h1{font-size:42px;line-height:.95;letter-spacing:-1px;font-weight:800}
  .bottom h1 span{color:#fff;opacity:.35}
  .bottom p{font-size:12px;opacity:.55;margin-top:8px;letter-spacing:.5px}
  .btn{pointer-events:auto;margin:6px 3px;display:inline-block;padding:11px 18px;border-radius:999px;background:#fff;color:#000;font-weight:700;text-decoration:none;font-size:13px;border:none;cursor:pointer}
  .btn-ghost{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.35)}
  .btn-pink{background:#fff;color:#000}
  #startBtn{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:10;padding:16px 26px;border-radius:999px;background:#fff;color:#000;font-weight:800;border:none;cursor:pointer;font-size:15px;box-shadow:0 0 60px rgba(255,255,255,.35)}
  #scanLine{position:fixed;left:0;right:0;height:1px;background:rgba(255,255,255,.9);box-shadow:0 0 20px #fff;z-index:3;display:none}
  video{position:fixed;bottom:8px;right:8px;width:90px;opacity:.25;border-radius:12px;z-index:1}
  #segCanvas{display:none}
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<video id="video" autoplay muted playsinline></video>
<canvas id="segCanvas" width="360" height="270"></canvas>
<div id="scanLine"></div>

<div class="ui">
  <div class="top"><span>AK.</span><span>PORTFOLIO — 2026</span><a href="presentation.html">← HOME</a></div>
  <div class="left">Ashish Kumar<br>MCA • JRU Ranchi<br><br>Builds cool things<br>with AI</div>
  <div class="right">Tradition<br>Meets Technology<br><br>Harit Utsav AI</div>
  <div class="bottom">
    <h1>ASHISH <span>KUMAR</span></h1>
    <p>Tradition Meets Technology • HARIT UTSAV AI • Multi Modal Gen AI • MVA Robotics</p>
    <div style="margin-top:8px">
      <button class="btn btn-pink" onclick="speakAboutMe()">🔊 Hear About Me</button>
      <button class="btn btn-ghost" onclick="stopVoice()">Stop</button>
      <a class="btn btn-ghost" href="presentation.html">View My Work ↗</a>
    </div>
  </div>
</div>

<button id="startBtn">✦ Enable Camera — Become Particles</button>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/selfie_segmentation.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script>
const canvas=document.getElementById('canvas');
const renderer=new THREE.WebGLRenderer({canvas,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,0.1,100);
camera.position.z=3.1;

// AVI STYLE: MANY small white particles, dense
const COUNT=6500;
const geo=new THREE.BufferGeometry();
const pos=new Float32Array(COUNT*3);
const targetPos=new Float32Array(COUNT*3);
const colors=new Float32Array(COUNT*3);
geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
geo.setAttribute('color',new THREE.BufferAttribute(colors,3));
// Small size = sharp statue look like in Reel
const mat=new THREE.PointsMaterial({size:0.016,vertexColors:true,transparent:true,opacity:0.95,sizeAttenuation:true,depthWrite:false});
const points=new THREE.Points(geo,mat);
scene.add(points);

for(let i=0;i<COUNT;i++){
  // Start scattered like in Reel 0.0s
  pos[i*3]=(Math.random()-0.5)*5; pos[i*3+1]=(Math.random()-0.5)*5; pos[i*3+2]=(Math.random()-0.5)*2;
  targetPos[i*3]=pos[i*3]; targetPos[i*3+1]=pos[i*3+1]; targetPos[i*3+2]=pos[i*3+2];
  colors[i*3]=1; colors[i*3+1]=1; colors[i*3+2]=1;
}
let hasBody=false, mouseX=0, mouseY=0;
addEventListener('mousemove',e=>{ mouseX=(e.clientX/innerWidth-0.5)*0.6; mouseY=(e.clientY/innerHeight-0.5)*0.3; });

const segCanvas=document.getElementById('segCanvas');
const segCtx=segCanvas.getContext('2d',{willReadFrequently:true});
const faceMesh=new FaceMesh({locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${f}`});
faceMesh.setOptions({maxNumFaces:1,refineLandmarks:true,minDetectionConfidence:0.5,minTrackingConfidence:0.5});
let facePts=null;
faceMesh.onResults(r=>{ if(r.multiFaceLandmarks?.length) facePts=r.multiFaceLandmarks[0]; });

const selfieSeg=new SelfieSegmentation({locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/${f}`});
selfieSeg.setOptions({modelSelection:1});
selfieSeg.onResults(res=>{
  if(!res.segmentationMask) return;
  hasBody=true;
  segCtx.drawImage(res.segmentationMask,0,0,segCanvas.width,segCanvas.height);
  let img; try{ img=segCtx.getImageData(0,0,segCanvas.width,segCanvas.height).data; }catch(e){return;}
  let body=[];
  // Sample densely - step 1 = sharp, not sparse
  for(let y=0;y<segCanvas.height;y+=1){
    for(let x=0;x<segCanvas.width;x+=1){
      if(img[(y*segCanvas.width+x)*4+3]>120) body.push([x/segCanvas.width,y/segCanvas.height]);
    }
  }
  if(body.length<100) return;
  for(let i=0;i<COUNT;i++){
    const p=body[Math.floor(Math.random()*body.length)];
    // Avi framing: head + shoulders centred, tall. Face area gets more density via face landmarks
    targetPos[i*3]=(p[0]-0.5)*2.35;
    targetPos[i*3+1]=(0.5-p[1])*3.2+0.1;
    targetPos[i*3+2]=(Math.random()-0.5)*0.12;
    // White with slight grey variation for depth - like Reel
    const v=0.75+Math.random()*0.25;
    colors[i*3]=v; colors[i*3+1]=v; colors[i*3+2]=v;
  }
  // Face detail boost: overwrite 35% particles with exact face mesh for glasses / eyes sharpness
  if(facePts){
    for(let i=0;i<COUNT*0.35;i++){
      const fp=facePts[Math.floor(Math.random()*facePts.length)];
      // Map face mesh to same space as body - face is upper part
      targetPos[i*3]=(fp.x-0.5)*2.35;
      targetPos[i*3+1]=(0.5-fp.y)*3.2+0.1;
      targetPos[i*3+2]=fp.z*-0.4;
      colors[i*3]=1; colors[i*3+1]=1; colors[i*3+2]=1;
    }
  }
  geo.attributes.color.needsUpdate=true;
});

document.getElementById('startBtn').onclick=async()=>{
  document.getElementById('startBtn').style.display='none';
  // Scan line animation like Reel intro
  const line=document.getElementById('scanLine'); line.style.display='block';
  let y=0; const iv=setInterval(()=>{ y+=4; line.style.top=y+'px'; if(y>innerHeight){ clearInterval(iv); line.style.display='none'; } },16);
  const video=document.getElementById('video');
  const cam=new Camera(video,{onFrame:async()=>{ await selfieSeg.send({image:video}); await faceMesh.send({image:video}); },width:640,height:480});
  cam.start();
  setTimeout(()=>speakAboutMe(),1000);
};

function animate(){
  requestAnimationFrame(animate);
  for(let i=0;i<COUNT;i++){
    // Slow smooth converge - cinematic like Reel, not jumpy
    const speed = hasBody ? 0.12 : 0.02;
    pos[i*3]+=(targetPos[i*3]-pos[i*3])*speed;
    pos[i*3+1]+=(targetPos[i*3+1]-pos[i*3+1])*speed;
    pos[i*3+2]+=(targetPos[i*3+2]-pos[i*3+2])*speed;
    // Tiny breathing float
    pos[i*3+1]+=Math.sin(Date.now()*0.0008+i)*0.0004;
  }
  points.rotation.y += (mouseX - points.rotation.y)*0.04;
  points.rotation.x += (mouseY - points.rotation.x)*0.04;
  geo.attributes.position.needsUpdate=true;
  renderer.render(scene,camera);
}
animate();
addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()});

// VOICE - Female
const aboutText="Hello! I am Ashish Kumar. I am an M C A student at Jharkhand Rai University, Ranchi. I build Artificial Intelligence that connects tradition with technology. My project Harit Utsav A I makes Indian festivals sustainable, safe, and eco friendly. I also built Multi Modal Gen A I, which was appreciated at Gwalior Hackathon. Our festivals taught us to respect nature, and my technology helps us protect it. Thank you for visiting my portfolio.";
function speakAboutMe(){
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(aboutText);
  u.rate=0.95; u.pitch=1.15; u.volume=1; u.lang='en-IN';
  const voices=speechSynthesis.getVoices();
  let v=voices.find(v=>/female|Zira|Samantha|Google US English|Neerja|Ananya/i.test(v.name))||voices.find(v=>v.lang.startsWith('en-IN'))||voices.find(v=>v.lang.startsWith('en-'));
  if(v) u.voice=v; speechSynthesis.speak(u);
}
function stopVoice(){ speechSynthesis.cancel(); }
</script>
</body>
</html>
